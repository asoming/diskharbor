name: Native performance and accessibility
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Platforms to measure
        type: choice
        default: all
        options: [all, macos, ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
      diagnostics:
        description: Record diagnostic timing (adds overhead; not release acceptance)
        type: boolean
        default: false
      trace:
        description: Capture bounded Chromium startup and interaction trace (diagnostic only)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runner == 'all' && '["ubuntu-latest","windows-latest","macos-latest","macos-15-intel"]' || inputs.runner == 'macos' && '["macos-latest","macos-15-intel"]' || format('["{0}"]', inputs.runner)) }}
    runs-on: ${{ matrix.os }}
    env:
      DISKHARBOR_PERFORMANCE_DIAGNOSTICS: ${{ inputs.diagnostics && '1' || '0' }}
      DISKHARBOR_PERFORMANCE_TRACE: ${{ inputs.trace && '1' || '0' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure Linux sandbox helper
        if: runner.os == 'Linux'
        run: |
          node -e "console.log(require('electron'))"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Real 100k files and synthetic 1M index (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:performance
      - name: Real 100k files and synthetic 1M index (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:performance
      - name: Preserve budgets, measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            output/performance-smoke-*/report.json
            output/performance-smoke-*/fixture.json
            output/performance-smoke-*/memory.json
            output/performance-smoke-*/queries.json
            output/performance-smoke-*/diagnostics.json
            output/performance-smoke-*/trace.json.gz
            output/performance-smoke-*/*.png
          if-no-files-found: warn
