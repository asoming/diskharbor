name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve Electron runtime before desktop tests
        run: node scripts/resolve-electron.cjs
      - run: npm test
      - run: npm run build
      - name: Configure Linux sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Install isolated Linux restoration test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus libglib2.0-bin gvfs gvfs-daemons
      - name: Native desktop smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Native desktop smoke (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Scan and navigation smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:navigation
      - name: Hidden cleanup review (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:cleanup-review
      - name: Hidden cleanup review (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:cleanup-review
      - name: Scan and navigation smoke (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:navigation
      - name: Browser cache guidance smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:cache
      - name: Browser cache guidance smoke (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:cache
      - name: Scan scope coverage smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:scope
      - name: Scan scope coverage smoke (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:scope
      - name: Volume space verification smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:space
      - name: Volume space verification smoke (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:space
      - name: Native Linux restoration smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:restore
      - name: Display visibility smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:visibility
      - name: Display visibility smoke (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:visibility
      - name: Save desktop test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-${{ runner.os }}-${{ runner.arch }}
          path: |
            output/native-smoke-*/report.json
            output/cleanup-review-smoke-*/report.json
            output/cleanup-review-smoke-*/*.png
            output/navigation-smoke-*/report.json
            output/cache-smoke-*/report.json
            output/scope-smoke-*/report.json
            output/space-smoke-*/report.json
            output/restore-smoke-*/report.json
            output/restore-smoke-*/isolation.json
            output/visibility-smoke-*/report.json
          if-no-files-found: ignore
