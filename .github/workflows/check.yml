name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Resolve Electron runtime
        run: node -e "console.log(require('electron'))"
      - name: Configure Linux sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Native desktop smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Native desktop smoke (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Scan and navigation smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:navigation
      - name: Scan and navigation smoke (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:navigation
      - name: Browser cache guidance smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:cache
      - name: Browser cache guidance smoke (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:cache
      - name: Scan scope coverage smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:scope
      - name: Scan scope coverage smoke (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:scope
      - name: Save desktop test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-${{ runner.os }}
          path: |
            output/native-smoke-*/report.json
            output/navigation-smoke-*/report.json
            output/cache-smoke-*/report.json
            output/scope-smoke-*/report.json
          if-no-files-found: ignore
