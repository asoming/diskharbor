name: Unsigned release validation

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted runner to validate (all includes both Mac architectures)
        required: true
        default: all
        type: choice
        options:
          - all
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-15-intel

# This creates CI artifacts only. It cannot publish a GitHub Release or obtain
# a developer signing identity from repository secrets.
permissions:
  contents: read

concurrency:
  group: unsigned-release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-release:
    name: Native package and Firefox (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runner == 'all' && '["ubuntu-latest","windows-latest","macos-latest","macos-15-intel"]' || format('["{0}"]', inputs.runner)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      DISKHARBOR_RELEASE_VALIDATION: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve Electron runtime before validation
        run: node scripts/resolve-electron.cjs
      - run: npm test
        id: tests
      - name: Check out the published alpha.11 upgrade baseline
        uses: actions/checkout@v4
        with:
          ref: 41eab5d9a2c2ddadd5ff71739df63a3197139024
          path: work/upgrade-source
          persist-credentials: false
      - name: Install baseline build dependencies
        working-directory: work/upgrade-source
        run: npm ci
      - name: Build the actual alpha.11 upgrade baseline
        working-directory: work/upgrade-source
        run: npm run ${{ runner.os == 'Windows' && 'dist:win' || runner.os == 'macOS' && 'dist:mac' || 'dist:linux' }} -- --publish never --config.nsis.runAfterFinish=false
      - name: Build native unsigned prerelease artifacts
        run: npm run ${{ runner.os == 'Windows' && 'dist:win' || runner.os == 'macOS' && 'dist:mac' || 'dist:linux' }} -- --publish never
      - name: Refresh Linux package dependency metadata
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install, launch and uninstall native package (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/package-validation.cjs
      - name: Install, launch and uninstall native package (Windows and macOS)
        if: runner.os != 'Linux'
        run: node scripts/package-validation.cjs
      - name: Validate real Firefox default-layout cache and native cache-only clearing
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/browser-cache-validation.cjs
      - name: Save exact validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            output/package-validation-*/report.json
            output/package-validation-*/*.log
            output/browser-validation-*/report.json
            output/browser-validation-*/driver.log
          if-no-files-found: warn
      - name: Save unsigned prerelease artifacts and SHA256 checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-prerelease-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            release/*/*.deb
            release/*/*.tar.gz
            release/*/*.exe
            release/*/*.dmg
            release/*/SHA256SUMS-*.txt
          if-no-files-found: warn
